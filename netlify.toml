[build]
  functions = "netlify/functions"

[functions]
  # Allow the Gemini function up to 60s (max on Netlify's enterprise plan).
  # Free/pro plans cap sync functions at 26s but the config is harmless.
  [functions."groq"]
    timeout = 60



[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/groq"
  to = "/.netlify/functions/groq"
  status = 200